services:
  dms-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder

    image: dms-ondevice:dev
    container_name: dms_container
    restart: unless-stopped

    volumes:
      - .:/workspace/dms_project
      - /tmp/.X11-unix:/tmp/.X11-unix:ro

    environment:
      # X11 GUI 출력
      - DISPLAY=${DISPLAY:-host.docker.internal:0.0}
      - TZ=Asia/Seoul

    # 카메라 장치 매핑은 제거
    # devices:
    #   - "/dev/video0:/dev/video0"

    # 필요하면 유지
    privileged: true

    # 기존 host network는 일단 제거 권장
    # network_mode: "host"

    stdin_open: true
    tty: true

    command: /bin/bash